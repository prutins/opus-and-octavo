concert:
  concertTitle: The Sage City Symphony
  ensembleName: Sage City Symphony
  date: 2026-05-20
  location: Greenwall Auditorium
  conductor: Gerald Lanoue and Diane Bargiel
  biographies:
    - name: Diane Bargiel, Conductor
      bio: Diane Bargiel received her Bachelor of Music degree in clarinet from the Dana School of Music, a Master of Music in clarinet from Michigan State University, Certification in Music Education from Carnegie Mellon University, and a certificate in Arts Administration from New York University. Diane also concentrated on conducting in graduate conducting seminars with Eugene Corporon, lessons with William Wiedrich, seven workshops with Larry Rachleff and Robert Cameron, and additional workshops with Allan McMurray, Elizabeth Green, Frank Battisti and others. In 2021, she retired from SUNY Adirondack as the last Humanities division chair and Associate Professor of Music. In 2015, Prof. Bargiel received the SUNY Chancellor’s Award for Excellence in Scholarship and Creative Activities and in 1995 while at Susquehanna University, was presented the Dean’s Award for Excellence in Teaching. Diane has been the principal clarinetist of the Sage City since 2012. Ms. Bargiel currently serves on the board of New England Arts Presenters as the chair of its Engagement committee, and is an adjunct at Burr and Burton Academy in Manchester, Vermont. Other professional highlights include having been president of the New York Association of College Music Programs, president of Pennsylvania Presenters, a board member of Arts Presenters of Northern New England, the Pennsylvania state chair of the College Band Director’s National Association, a member of the first Creative Communities Council of Windham County (VT), a planning committee member for the first Performing Arts Exchange that covered the entire East Coast, and was also a conductor and panelist at the 2000 CBDNA Eastern Regional Conference at Yale University, among numerous other roles and volunteer involvement.
      photo: ""
    - name: Gerald Lanoue, Conductor
      bio: Gerald Lanoue D.M.A., a Bennington Vermont native, is an active conductor and bassoonist in the Upstate New York and Southern Vermont area. Dr. Lanoue is privileged to be the music director for the Music Company Orchestra and is currently the principal bassoonist with the Sage City Symphony. He received an undergraduate education at the Crane School of Music in Potsdam New York and a masters and doctorate at the University of Southern California. He studied conducting with Douglas Lowry, past Dean and conductor at the Eastman School of Music, as well as John Barnett, the associate conductor of the Los Angeles Philharmonic. Dr. Lanoue has served on the faculties of Riverside Community College and Santa Monica College. While in California he was an active orchestral and chamber musician serving as Principal Bassoon for the Bakersfield Symphony, Los Angeles Classical Ballet, Redlands Symphony, and the American Youth Symphony. He has performed most notably with Daniel Lewis, Yehuda Gilad, Jerry Goldsmith, Michael Kamien and Zubin Mehta.
      photo: ""
    - name: Michael Emery, Concert Master and Violin Soloist
      bio: Michael Emery has blended performance with teaching to create an active musical career. He has collaborated in chamber music with many international artists, including Ruggiero Ricci, Elizabeth Pitcairn, André-Michel Schub, and Emanuel Ax, and has performed in the Sibelius, Ludwig Spohr and Paganini International Violin Competitions. He is concertmaster and frequent soloist with orchestras in New York and California, and has performed as soloist and concertmaster in Asia, as well as several major European cities. Mr. Emery has performed in collaboration with many contemporary composers, including Gunther Schuller, Jennifer Higdon, Joan Tower, Ezra Laderman, Lowell Liebermann, Tommie Haglund, Richard Danielpour, and John Corigliano. Mr. Emery earned his MM in Performance from the Manhattan School of Music as a scholarship student with Erick Friedman and Raphael Bronstein, and served as concertmaster of the Manhattan Symphony. Michael is currently the concertmaster of the Sage City Symphony.
      photo: data:image/png;base64,
    - name: Michael Finckel, Cello Soloist
      bio: Michael Finckel enjoys a wide-ranging career as cellist, conductor, teacher and composer. A founding member of the Trio of the Americas and the Cabrini Quartet, he performs as soloist and chamber musician throughout the U.S. and with members of his family in the renowned Finckel Cello Quartet. His interest in contemporary music has involved him in performances with New York’s leading new music ensembles including Speculum Musicae, Ensemble Sospeso, Columbia Symphonietta, the Group for Contemporary Music, Steve Reich and Musicians, and the American Composers Orchestra, as well as performances with members of the New York Philharmonic, under the direction of Pierre Boulez and Leonard Bernstein. Mr. Finckel has been Music Director of the Sage City Symphony in Vermont since 1982, and oversees the orchestra’s extensive commissioning program. He is a member of the Hoff-Barthelson faculty, and is a regular summer faculty member of the Chamber Music Conference and Composer’s Forum of the East (Vermont), and the Composers Conference and Chamber Music Center at Wellesley College in Massachusetts.
      photo: data:image/png;base64,
    - name: "About our Music Director: Michael Finckel"
      bio: |-
        Having served as principal cellist during Sage City Symphony's early years in the 1970s, and later as a commissioned composer and cello soloist, Music Director Michael Finckel continues the unique traditions and musical standards of the orchestra's founder, Louis Calabro.

        A native of Bennington, Vermont, Michael's formative studies were with his parents, both prominent musicians well known throughout the state. He later attended Oberlin College Conservatory of Music and Bennington College, where he studied composition, conducting, and orchestration with Louis Calabro and Henry Brant. He has taught cello and composition at Bennington and Marymount Colleges, and at Princeton and Cornell Universities. As a member of the faculty of the Vermont Governor's Institute on the Arts, he taught gifted junior and senior high school students from around the state.

        Currently living in New York City, Michael is engaged in an active multi-faceted career as soloist, chamber musician, composer, teacher, and conductor. As a cellist, he has performed with orchestral and chamber ensembles in venues from coast to coast and across Europe. His interest in contemporary music has involved him in regular collaborations with some of New York's leading new music ensembles and performances under the direction of Leonard Bernstein and Pierre Boulez.
