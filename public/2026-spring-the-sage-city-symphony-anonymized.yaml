    - title: Symphonic Metamorphosis on Themes of Carl Maria von Weber
      movements: |-
        Allegro
        Turandot, Scherzo
        Andantino
        Marsch
      composer: |-
        Paul Hindemith
        (1895-1963)
      featured: Gerald Lanoue, Conductor
      programNote: |-
        Symphonic Metamorphosis on Themes of Carl Maria von Weber began life in early 1940, when Hindemith first took up residence in the United States after several years of public and private jousting with the Nazi government of his native Germany. The Nazis officially decried his music as “degenerate,” though they may also have been responding to his private, but hardly secret, expressions of revulsion regarding their policies.

        Hindemith sketched a series of movements based on themes by Weber, to be used in a ballet for a dance company run by Léonide Massine, who had already collaborated with Hindemith on the ballet Nobilissima visione. The project died when Hindemith and Massine suffered one too many artistic differences, provoking Hindemith to reconstruct the music into the Symphonic Metamorphosis on Themes of Carl Maria von Weber. The process produced a splashy, colorful orchestral piece of the kind that American audiences in particular seemed to like. The new piece was an immediate success when it was premiered by Artur Rodzinski and the New York Philharmonic in January 1944. Symphonic Metamorphosis on Themes of Carl Maria von Weber has remained perhaps Hindemith’s most popular work.

        The themes Hindemith used are from some of Weber’s most obscure works, and came to Hindemith’s attention because they could all be found in one volume of piano duets that he owned. Hindemith not only retained all but one of the themes almost exactly as Weber wrote them but also preserved much of the formal structure of the pieces as well, so that it is possible to follow the general outlines of Hindemith’s score while listening to Weber’s music, or vice versa, and have a pretty good idea of what’s going on. Hindemith alters nearly everything else, making radical changes to the harmony and adding to the music both vertically (with different harmonies and new countermelodies) and horizontally (extending phrases or entire sections).

        Symphonic Metamorphosis showcases Hindemith’s unique compositional language with its virtuosic woodwind runs, inventive contrapuntal schemes, and prevalent use of perfect fourths. The work begins with a machine-like ostinato, which precedes the introduction of the main theme in the upper woodwinds. Much of the first movement alternates between triumphant brass fanfares and contrapuntal writing for small groups of woodwind instruments, culminating with a bright and climactic A Major chord.

        The second movement is based on themes introduced by the flute, clarinet, and piccolo in its opening call and response. After a brief percussion episode, the main theme passes between sections in seven complete statements. The composer’s contrapuntal artistry is put on full display as a second theme is introduced and developed into two fugues — the first ferociously scored for brass, the second a toccata for woodwinds. A second percussion episode leads to an abbreviated recapitulation in which the original theme is presented in a truncated form, again, seven times before resolving with in a serene F Major chord.

        Movement three begins with song-like woodwind solos accompanied by colorful, occasionally bird-like, ensemble interjections. The music intensifies through the addition of new instruments and denser harmonies leading to a reintroduction of the opening material enhanced by a virtuosic flute obbligato.

        The “March” begins with trumpets and trombones playing a four-note declamatory fanfare based upon the interval of a perfect fourth. Hindemith develops the opening motive into the main theme of the movement, heard first in the woodwinds. In the trio, the horns introduce a second, more heroic theme. The two themes alternate throughout the movement, and the four-note fanfare returns to bring the work to a thrilling conclusion.
