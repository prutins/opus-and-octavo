      ## Volunteer!

      We invite you to join us in bringing music to our community! Whether you are a musician/player, an avid listener, or general supporter of the arts, there are opportunities to help the organization. We can use more people to fulfill other tasks, such as hanging posters, sending out press releases, posting on social media, setting up chairs, organizing fundraisers, helping with finances, and more. Please speak to a Board member, email us at sagecity802@gmail.com, or contact us through our website (www.sagecitysymphony.org).
    - |-
      ## Special Mention

      The Matching Fund drive by Karl Brosch brought in a wave of donations last year. In concert with extraordinarily generous donations by these other donors, we have created a reserve fund to give us greater flexibility in handling future fiscal challenges. We are especially thankful to Karl Brosch, Nan Newton, Christine Graham, Julius Rosenwald and Margo Gardner, Charles and Linda Putney, Joan Devoe and Lyndon Moors, Dennis and Marcy McCarthy, and Lee and Melinda Paquin.
