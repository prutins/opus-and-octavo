  items:
    - title: |-
        Concerto for Violin and Cello in A minor, Op. 102

        ("Double Concerto")
      movements: |-
        Allegro
        Andante
        Vivace non troppo
      composer: |-
        Johannes Brahms
        (1833-1897)
      featured: |-
        Michael Emery, Violin
        Michael Finckel, Cello
        Diane Bargiel, Guest Conductor
      programNote: |-
        Brahms’ Double Concerto was his final work for orchestra, completed in the summer of 1887. Unusual in form, it features not one soloist but two—the violin and cello—engaged in intimate partnership, often exchanging lyrical phrases or blending into a single voice. The work was composed as a gesture of reconciliation toward his old friend, violinist Joseph Joachim, after a personal rift had separated them. By writing a concerto that Joachim could share with the cellist Robert Hausmann, Brahms offered not only a musical gift but also a personal olive branch.

        The concerto opens with an arresting orchestral statement, followed by the cello’s noble recitative-like entrance. The violin soon joins, and the two soloists launch into a dramatic dialogue. Throughout the first movement (Allegro), one hears Brahms’ mature style—weighty, intricate, yet full of warmth.

        The slow movement (Andante) offers the heart of the concerto: a broad, songful duet between violin and cello that floats gently above the orchestra. Here Brahms achieves a chamber-like intimacy, as if inviting the audience to overhear a private musical conversation.

        The finale (Vivace non troppo) is spirited and genial, infused with Hungarian dance rhythms that recall the composer’s lifelong love of folk-inspired music. After moments of brilliance and play, the concerto closes with warmth rather than thunder, a fitting farewell to Brahms’ orchestral voice.
      programNoteAuthor: https://independence-sinfonia.org/concert-1-program-notes-brahms-double-concerto.pdf
      photo: ""
    - title: "Vieille prière bouddhique: Prière quotidienne pour tout l’Univers"
      movements: ""
      composer: |-
        Lili Boulanger
        (1893-1918)
      featured: |-
        <p>(An Old Buddhist Prayer: Daily Prayer for the Universe) for chorus and orchestra</p>

        <p>
        <strong>Chorus members from:</strong><br />
        Battenkill Chorale, Gene Marie Callahan, Music Director<br />
        Bennington County Choral Society, Ben April, Music Director<br />
        Burr and Burton Academy, Julie Freebern, Vocal Ensemble Director<br />
        Northern Berkshire Chorale, Anna Lenti, Music Director<br />
        Bennington College Voice Studios<br />
        First Congregational Church of Manchester, Linda Hueckel, Music Director<br />
        United Church of Dorset and East Rupert, Tom Salmon, Music Director
        </p>

        <p>The Sage City Symphony expresses its deep gratitude to our wonderful choral neighbors for finding the time and the energy to collaborate with us.</p>

        <p>Diane Bargiel, Guest Conductor</p>
      programNote: |-
        The French composer Lili Boulanger. . . ranks alongside her sister, the conductor and teacher Nadia Boulanger, among the most significant female figures in the history of music.” (Konstantin Galluhn, 2010/Translation: Bradford Robinson).

        While studying in Rome in 1914 at the age of 21, Lili Boulanger began working on setting this excerpt from an ancient Buddhist text, which emphasizes loving kindness toward all creatures. When World War I broke out, she returned to France to help with war-time needs, alongside her sister, Nadia, and the work’s completion was delayed until 1917 and premiered in 1921.

        Boulanger breaks up the text into four stanzas, each followed by the refrain, “without enemies, without obstacles, overcoming pain and attaining happiness, be able to move freely, each one in the path destined for them.”

        TEXT AND TRANSLATION

        |  | French translation by Suzanne Karpelès | English Translation |
        |---|---|---|
        | I: | <span lang="fr">Que toute chose qui respire</span> | Let everything that breathes |
        | | | |
        | II: | <span lang="fr">-- que toutes les créatures et partout</span> | -- let all creatures everywhere, |
        | | <span lang="fr">Tous les esprits et tous ceux qui sont nés</span> | all the spirits and all those who are born, |
        | | | |
        | III: | <span lang="fr">Que toutes les femmes, que tous les hommes</span> | all the women, all the men, |
        | | <span lang="fr">Les Aryens, et les non-Aryens</span> | Aryans and non-Aryans, |
        | | <span lang="fr">Tous les dieux et tous les humains</span> | all the gods and all the people, |
        | | <span lang="fr">Et ceux qui sont déchus</span> | and those who have fallen, |
        | | | |
        | IV: | <span lang="fr">En orient et en Occident, au Nord et au Sud</span> | in the East and in the West, in the North and the South, |
        | | <span lang="fr">Que tous les êtres qui existent --</span> | Let all beings which exist -- |
        | | <span lang="fr">Sans ennemis, sans obstacles, surmontant la douleur</span> | without enemies, without obstacles, overcoming pain |
        | | <span lang="fr">Et atteignant le bonheur, puisse se mouvoir librement</span> | and attaining happiness, be able to move freely, |
        | | <span lang="fr">Chacun dans la voie qui lui est destinée</span> | each one in the path destined for them. |

        <p style="footnote">* “ ‘Abode of the Aryans’ is a name for Northern India in classical Sanskrit literature. The Manu Smriti (2.22) gives the name to ‘the tract between the Himalaya and the Vindhya ranges, from the eastern to the western sea.’” (Tibetan Buddhist Encyclopedia)</p>

        Both the early Church of Rome and the Buddhist tradition are called to mind by the chant-like style of the thematic construction. This is supported by the use of modal scales, with particular emphasis on the Phrygian mode. The choices made within the French Impressionistic color palette for the orchestra include the ethereal nature of two harps and celeste, a flute solo reminiscent of Debussy’s Prelude to the Afternoon of a Faun (1894), and the darker resonances of the English horn, bass clarinet, sarrusophone (played here using a contra-bassoon), along with four trombones and tuba. The lushness of the orchestral writing paired with the voices, sometimes singing angelically in repeated melodic intervals without words, work hand-in-hand to create a very emotional musical experience that enhances the spiritual nature and meaning of the text itself.
      programNoteAuthor: Diane Bargiel
